:root{--deep:#0B3D2E;--green:#2F6B3E;--sand:#E6D3AE;--gold:#B98E3E;--cream:#F7F2EA}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--deep);color:var(--sand);font-family:RB,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% 0%,#14513d 0%,transparent 60%),radial-gradient(ellipse at 50% 120%,#062a1f 0%,transparent 60%)}
.frame{position:fixed;inset:clamp(12px,2.5vw,32px);border:1.5px solid var(--gold);pointer-events:none}
.frame::after{content:"";position:absolute;inset:6px;border:1px solid #b98e3e55}
main{position:relative;z-index:1;text-align:center;padding:48px 20px;width:100%;max-width:1000px}
.logo{width:clamp(130px,20vw,200px);height:auto;display:block;margin:0 auto 22px;filter:drop-shadow(0 10px 30px #0006)}
h1{margin:0;font:700 clamp(28px,4.6vw,48px) RB;color:var(--sand);letter-spacing:.5px}
.sub{margin:10px 0 0;font:400 clamp(15px,2vw,20px) RB;color:var(--cream);opacity:.85}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px auto 30px;color:var(--gold)}
.orn i{display:block;height:1px;width:clamp(50px,12vw,120px);background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.orn b{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2vw,22px);max-width:820px;margin:0 auto}
.u{background:linear-gradient(180deg,#0f4836,#0a3628);border:1px solid #b98e3e66;border-radius:14px;padding:clamp(16px,3vw,28px) 6px clamp(12px,2vw,18px);position:relative;overflow:hidden}
.u::before{content:"";position:absolute;left:12%;right:12%;top:0;height:2px;background:var(--gold);border-radius:0 0 2px 2px}
.n{font:700 clamp(40px,8.5vw,92px)/1 RB;color:var(--sand);font-variant-numeric:tabular-nums;transition:transform .25s}
.n.tick{animation:tick .45s ease}
@keyframes tick{0%{transform:translateY(-6px);opacity:.4}100%{transform:none;opacity:1}}
.l{margin-top:10px;font:400 clamp(13px,1.8vw,18px) RB;color:var(--gold)}
.target{margin:34px 0 0;font:700 clamp(16px,2.3vw,22px) RB;color:var(--cream)}
.badge{display:inline-block;margin:0 0 12px;font:700 clamp(13px,1.8vw,16px) RB;background:var(--gold);color:var(--deep);padding:6px 18px;border-radius:999px}
.hijri{margin:6px 0 0;font:400 clamp(13px,1.7vw,16px) RB;color:var(--gold)}
.bar{max-width:820px;margin:28px auto 0;height:6px;border-radius:999px;background:#ffffff14;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(270deg,var(--sand),var(--gold));border-radius:999px;transition:width 1s linear}
.pct{margin-top:8px;font:400 13px RB;color:#e6d3aeaa}
.done{display:none}
body.finished .grid,body.finished .bar,body.finished .pct{display:none}
body.finished .done{display:block;font:700 clamp(36px,7vw,72px) RB;color:var(--sand);margin:10px 0 4px;animation:tick 1s ease}
footer{margin-top:40px;font:400 13px RB;color:#e6d3ae80}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>

<script>
(function(){
  var TARGET = new Date('2026-11-20T09:00:00+03:00').getTime();

  var AR = '٠١٢٣٤٥٦٧٨٩';
  function ar(n,pad){var s=String(n);if(pad&&s.length<2)s='0'+s;return s.replace(/\d/g,function(c){return AR[c];});}
  var els={d:document.getElementById('d'),h:document.getElementById('h'),m:document.getElementById('m'),s:document.getElementById('s')};
  var last={};
  function set(k,v){if(last[k]!==v){els[k].textContent=v;els[k].classList.remove('tick');void els[k].offsetWidth;els[k].classList.add('tick');last[k]=v;}}
  function tick(){
    var now=Date.now(), diff=TARGET-now;
    if(diff<=0){document.body.classList.add('finished');return false;}
    var t=Math.floor(diff/1000);
    set('d',ar(Math.floor(t/86400)));
    set('h',ar(Math.floor(t%86400/3600),true));
    set('m',ar(Math.floor(t%3600/60),true));
    set('s',ar(t%60,true));
    var p=Math.min(100,Math.max(0,(now-START)/(TARGET-START)*100));
    document.getElementById('bar').style.width=p+'%';
    document.getElementById('pct').textContent='مضى '+ar(Math.floor(p))+'٪ من الانتظار';
    return true;
